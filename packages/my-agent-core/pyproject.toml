[project]
name = "my-agent-core"
version = "0.1.0"
description = "my_agent_core: minimal agent framework modeled on pi / pig-mono (learning project)"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.50.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0,<2.0",
    "my-agent-llm",
]

[tool.uv.sources]
my-agent-llm = { path = "../my-agent-llm" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent_core"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
