[project]
name = "my-coding-agent"
version = "0.1.0"
description = "my_coding_agent: coding agent product layer on my-agent-core (learning project)"
requires-python = ">=3.11"
dependencies = [
    "my-agent-core",
    "my-agent-llm",
    "mcp>=2.0.0",
]

[tool.uv.sources]
my-agent-core = { path = "../my-agent-core" }
my-agent-llm = { path = "../my-agent-llm" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_coding_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]