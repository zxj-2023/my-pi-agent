[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-pi-eval"
version = "0.1.0"
description = "Harbor evaluation adapter and test runner for my-pi-agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "harbor>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/my_pi_eval"]
